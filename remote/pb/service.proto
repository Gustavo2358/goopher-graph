syntax = "proto3";
package gophergraph.remote.v1;
option go_package = "gophergraph/remote/pb";

// A result is complete only after ResultEnd AND the final RPC status OK.
service GraphService {
  rpc Territory(TerritoryRequest) returns (stream EncodedBatch);
  rpc AntiTerritory(AntiTerritoryRequest) returns (stream EncodedBatch);
  rpc Between(BetweenRequest) returns (stream EncodedBatch);
  rpc RunWasm(RunWasmRequest) returns (stream EncodedBatch);
  rpc ListWasmQueries(ListWasmQueriesRequest) returns (ListWasmQueriesResponse);
  rpc GetServerInfo(ServerInfoRequest) returns (ServerInfoResponse);
}
// Absent filter allows all labels; a present empty filter allows none.
message EdgeLabelFilter { repeated string labels = 1; }
// Presence is required. An explicitly present empty external ID is valid.
message TerritoryRequest { optional string node = 1; EdgeLabelFilter edge_filter = 2; }
message AntiTerritoryRequest { optional string node = 1; EdgeLabelFilter edge_filter = 2; }
message BetweenRequest { optional string from = 1; optional string to = 2; EdgeLabelFilter edge_filter = 3; }
message RunWasmRequest { string query_name = 1; repeated string args = 2; optional string expected_sha256 = 3; }
// Exactly one canonical GGPB Batch, without file magic, length or CRC framing.
message EncodedBatch { bytes ggpb = 1; }
message WasmQueryInfo {
  string name = 1; string sha256 = 2; string version = 3;
  string description = 4; string abi = 5;
  uint32 min_args = 6; uint32 max_args = 7; repeated string parameters = 8;
}
message ListWasmQueriesRequest {}
message ListWasmQueriesResponse { repeated WasmQueryInfo queries = 1; string registry_sha256 = 2; }
message ServerInfoRequest {}
message ServerInfoResponse {
  string version = 1; string snapshot_id = 2; uint32 snapshot_format = 3;
  uint64 snapshot_bytes = 4; uint64 nodes = 5; uint64 edges = 6; bool partial_snapshot = 7;
  string residency_mode = 8; bool warm_completed = 9; bool locked = 10; uint64 locked_bytes = 11;
  uint32 ggpb_version = 12; uint32 max_batch_bytes = 13; uint32 max_request_bytes = 14;
  uint32 query_capacity = 15; uint32 wasm_capacity = 16; uint64 max_deadline_millis = 17;
  repeated string capabilities = 18; string registry_sha256 = 19;
  uint32 wasm_args_bytes = 20; uint64 wasm_timeout_millis = 21;
  uint32 wasm_memory_pages = 22; uint64 wasm_host_bytes = 23;
}
